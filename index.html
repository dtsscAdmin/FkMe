    // --- SOUND EFFECTS (Web Audio API Synthesizer) ---
    const playSoundEffect = (type, enabled = true) => {
      if (!enabled || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'swipe') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.16);
        } else if (type === 'superlike') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.2);
          });
        } else if (type === 'match') {
          [440, 554.37, 659.25, 880].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.26);
          });
        } else if (type === 'message') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        }
      } catch (e) {}
    };

          if (currentCard.id === 1 || Math.random() > 0.35) {
            setTimeout(() => {
              setMatchedProfile(currentCard);
              setShowMatchModal(true);
              playSoundEffect('match', userProfile.soundEffects);
            }, 220);

            if (!matches.some(m => m.profile.id === currentCard.id)) {
              setMatches(prev => [
                {
                  id: currentCard.id,
                  profile: currentCard,
                  lastMessage: direction === 'superlike' ? "You Super Liked Elena!" : "It's a Match! Say hi!",
                  timestamp: "Just now",
                  unread: true,
                  chatHistory: [
                    { sender: 'them', text: `Hey ${userProfile.name}! Thanks for the ${direction === 'superlike' ? 'Super Like' : 'match'}! Love your vibe ✨`, time: "Just now" }
                  ]
                },
                ...prev
              ]);
            }
          }
        }

        setTimeout(() => {
          setLastAction(null);
          setCurrentIndex(prev => prev + 1);
          setPhotoIndex(0);
          setDragOffset({ x: 0, y: 0 });
        }, 280);
      };

      const handlePointerDown = (e) => {
        setIsDragging(true);
        dragStartRef.current = { x: e.clientX || (e.touches && e.touches[0].clientX) || 0, y: e.clientY || (e.touches && e.touches[0].clientY) || 0 };
      };

      const handlePointerMove = (e) => {
        if (!isDragging) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        setDragOffset({ x: clientX - dragStartRef.current.x, y: clientY - dragStartRef.current.y });
      };

      const handlePointerUp = () => {
        if (!isDragging) return;
        setIsDragging(false);
        if (dragOffset.x > 110) {
          handleSwipe('like');
        } else if (dragOffset.x < -110) {
          handleSwipe('pass');
        } else if (dragOffset.y < -120) {
          handleSwipe('superlike');
        } else {
          setDragOffset({ x: 0, y: 0 });
        }
      };

      const handleRewind = () => {
        if (history.length === 0) return;
        const lastItem = history[history.length - 1];
        setHistory(prev => prev.slice(0, -1));
        setCurrentIndex(lastItem.index);
        setPhotoIndex(0);
        playSoundEffect('swipe', userProfile.soundEffects);
      };

      const nextPhoto = (e) => {
        e.stopPropagation();
        if (currentCard && photoIndex < currentCard.photos.length - 1) {
          setPhotoIndex(prev => prev + 1);
        }
      };

      const prevPhoto = (e) => {
        e.stopPropagation();
        if (photoIndex > 0) {
          setPhotoIndex(prev => prev - 1);
        }
      };

      const sendMessage = (e) => {
        e?.preventDefault();
        if (!messageInput.trim() || !activeChat) return;

        const userText = messageInput.trim();
        const newMsg = {
          sender: 'me',
          text: userText,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        playSoundEffect('message', userProfile.soundEffects);

        setMatches(prevMatches =>
          prevMatches.map(m => {
            if (m.id === activeChat.id) {
              return {
                ...m,
                lastMessage: `You: ${newMsg.text}`,
                timestamp: "Just now",
                chatHistory: [...m.chatHistory, newMsg]

            }
            return m;
          })

        setMessageInput('');
        setShowEmojiPicker(false);

        setIsTyping(true);
        setTimeout(() => {
          setIsTyping(false);
          const aiResponses = [
            "That sounds amazing! Tell me more about it 😊",
            "Haha totally agree! So what are your plans for this weekend?",
            "Oh really? I was actually thinking about the exact same thing!",
            "That's so cool! We definitely have a lot in common.",
            "Nice! I'd love to chat more about this over coffee sometime ☕",
            "You have great taste! What other music or hobbies are you into?",
            "Haha you're fun to talk to! Glad we connected ✨"

          const replyText = aiResponses[Math.floor(Math.random() * aiResponses.length)];

            sender: 'them',
            text: replyText,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          playSoundEffect('message', userProfile.soundEffects);

          setMatches(prevMatches =>
            prevMatches.map(m => {
              if (m.id === activeChat.id) {
                return {
                  ...m,
                  lastMessage: replyText,
                  timestamp: "Just now",
                  chatHistory: [...m.chatHistory, replyMsg]
                };
              }
              return m;
            })
          );
        }, 1400);

                <span className="hidden md:inline">Swipe</span>
              </button>

              <button

                        <Star className="w-5 h-5 fill-current" />
                      </button>
                      <button onClick={() => handleSwipe('like')} className="w-14 h-14 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 text-white flex items-center justify-center shadow-lg shadow-rose-500/30 hover:scale-110 active:scale-95 transition-all cursor-pointer">

                      <RefreshCw className="w-4 h-4" /> Reset Cards Stack
                    </button>
                  </div>

              </div>

            {activeTab === 'explore' && (
              <div className="w-full max-w-4xl h-full overflow-y-auto p-2 sm:p-4 space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-white">Explore & Discover</h2>

                          className="flex-1 bg-slate-800 text-slate-100 text-sm rounded-full px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-rose-500/50"
                        />
                        <button type="submit" disabled={!messageInput.trim()} className="p-2.5 rounded-full bg-gradient-to-r from-rose-500 to-pink-500 text-white disabled:opacity-40 hover:scale-105 active:scale-95 transition-all shadow-md shadow-rose-500/20 cursor-pointer">
                          <Send className="w-4 h-4" />
                        </button>
                      </form>
                    </>
                  ) : (
                    <div className="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-500">
                      <MessageSquare className="w-12 h-12 stroke-[1.5] mb-2 text-slate-600" />
                      <p className="text-base font-semibold text-slate-300">Select a match to start chatting</p>
                      <p className="text-xs max-w-xs mt-1">Break the ice with a compliment or ask about their hobbies!</p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'profile' && (
              <div className="w-full max-w-2xl h-full overflow-y-auto p-4 space-y-6">
                <div className="bg-slate-900 rounded-2xl p-6 border border-slate-800 flex flex-col sm:flex-row items-center gap-6 text-center sm:text-left shadow-xl">
                  <div className="relative">
                    <img src={userProfile.photos[0]} alt="Profile" className="w-24 h-24 rounded-full object-cover border-4 border-slate-800 shadow-md" />
                    <button onClick={() => setIsEditingProfile(true)} className="absolute bottom-0 right-0 p-2 rounded-full bg-rose-500 text-white shadow-lg hover:bg-rose-600 transition-colors cursor-pointer">
                      <Camera className="w-4 h-4" />
                    </button>
                  </div>
                  <div className="flex-1 space-y-1">
                    <div className="flex items-center justify-center sm:justify-start gap-2">
                      <h2 className="text-xl font-bold text-white">{userProfile.name}, {userProfile.age}</h2>
                      <CheckCircle className="w-5 h-5 text-rose-500 fill-rose-500/20" />
                    </div>
                    <p className="text-xs text-slate-400">{userProfile.bio}</p>
                    <div className="flex flex-wrap justify-center sm:justify-start gap-1.5 pt-2">
                      {userProfile.interests.map((interest, i) => (
                        <span key={i} className="px-2.5 py-0.5 rounded-full text-xs bg-slate-800 text-slate-300 border border-slate-700">{interest}</span>
                      ))}
                    </div>
                    <div className="pt-2">
                      <button onClick={() => setIsEditingProfile(true)} className="text-xs text-rose-400 hover:text-rose-300 font-semibold underline underline-offset-4 cursor-pointer">
                        Edit Bio & Details
                      </button>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900 rounded-2xl p-6 border border-slate-800 space-y-6 shadow-xl">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2"><Sliders className="w-5 h-5 text-rose-500" /> Discovery Settings</h3>
                  <div className="space-y-2">
                    <div className="flex justify-between text-sm font-medium">
                      <span className="text-slate-300">Maximum Distance</span>
                      <span className="text-rose-400">{userProfile.distanceRange} miles</span>
                    </div>
                    <input type="range" min="5" max="100" value={userProfile.distanceRange} onChange={(e) => setUserProfile({ ...userProfile, distanceRange: parseInt(e.target.value) })} className="w-full accent-rose-500 h-2 bg-slate-800 rounded-lg cursor-pointer" />
                  </div>
                  <div className="space-y-2">
                    <div className="flex justify-between text-sm font-medium">
                      <span className="text-slate-300">Age Preference</span>
                      <span className="text-rose-400">{userProfile.ageRange[0]} - {userProfile.ageRange[1]}</span>
                    </div>
                    <input type="range" min="18" max="60" value={userProfile.ageRange[1]} onChange={(e) => setUserProfile({ ...userProfile, ageRange: [21, parseInt(e.target.value)] })} className="w-full accent-rose-500 h-2 bg-slate-800 rounded-lg cursor-pointer" />
                  </div>
                  <div className="space-y-2">
                    <span className="text-sm font-medium text-slate-300">Show Me</span>
                    <div className="grid grid-cols-3 gap-2">
                      {['Women', 'Men', 'Everyone'].map((type) => (
                        <button key={type} onClick={() => setUserProfile({ ...userProfile, genderPref: type })} className={`py-2 rounded-xl text-xs font-semibold transition-all ${userProfile.genderPref === type ? 'bg-rose-500 text-white shadow-md shadow-rose-500/20' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                          {type}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="space-y-4 pt-4 border-t border-slate-800">
                    <div className="flex items-center justify-between">
                      <div><h4 className="text-sm font-semibold text-slate-200">Incognito Mode</h4><p className="text-xs text-slate-400">Only show profile to people you like.</p></div>
                      <input type="checkbox" checked={userProfile.incognito} onChange={(e) => setUserProfile({ ...userProfile, incognito: e.target.checked })} className="w-5 h-5 accent-rose-500 cursor-pointer rounded" />
                    </div>
                    <div className="flex items-center justify-between">
                      <div><h4 className="text-sm font-semibold text-slate-200">Push Notifications</h4><p className="text-xs text-slate-400">Get notified about matches & messages.</p></div>
                      <input type="checkbox" checked={userProfile.notifications} onChange={(e) => setUserProfile({ ...userProfile, notifications: e.target.checked })} className="w-5 h-5 accent-rose-500 cursor-pointer rounded" />
                    </div>
                    <div className="flex items-center justify-between">
                      <div><h4 className="text-sm font-semibold text-slate-200">Sound Effects</h4><p className="text-xs text-slate-400">Audio feedback for swipes & matches.</p></div>
                      <input type="checkbox" checked={userProfile.soundEffects} onChange={(e) => { setUserProfile({ ...userProfile, soundEffects: e.target.checked }); if (e.target.checked) playSoundEffect('swipe', true); }} className="w-5 h-5 accent-rose-500 cursor-pointer rounded" />
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {isEditingProfile && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
              <div className="relative w-full max-w-md bg-slate-900 rounded-3xl p-6 border border-slate-800 shadow-2xl space-y-4">
                <h3 className="text-xl font-bold text-white">Edit Profile Details</h3>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Your Name</label>
                    <input type="text" value={editFormData.name} onChange={(e) => setEditFormData({ ...editFormData, name: e.target.value })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-rose-500" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Age</label>
                    <input type="number" value={editFormData.age} onChange={(e) => setEditFormData({ ...editFormData, age: parseInt(e.target.value) || 18 })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-rose-500" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Bio</label>
                    <textarea rows={3} value={editFormData.bio} onChange={(e) => setEditFormData({ ...editFormData, bio: e.target.value })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-rose-500" />
                  </div>
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => { setUserProfile(prev => ({ ...prev, name: editFormData.name, age: editFormData.age, bio: editFormData.bio })); setIsEditingProfile(false); }} className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-pink-500 text-white font-semibold text-sm shadow-md hover:opacity-90 transition-opacity cursor-pointer">Save Changes</button>
                  <button onClick={() => setIsEditingProfile(false)} className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-semibold text-sm hover:bg-slate-700 transition-colors cursor-pointer">Cancel</button>
                </div>
              </div>
            </div>
          )}

          {showBlindDateModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md animate-fade-in">
              <div className="relative w-full max-w-md bg-slate-900 rounded-3xl p-6 border border-slate-800 shadow-2xl space-y-5 text-center">
                <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center mx-auto shadow-lg shadow-rose-500/20">
                  <Zap className="w-8 h-8 text-white fill-white" />
                </div>
                <div>
                  <h3 className="text-2xl font-black text-white">FkMe Blind Matching</h3>
                  <p className="text-xs text-slate-400 mt-1">Answer honestly to discover your vibe match!</p>
                </div>
                <div className="p-4 bg-slate-800/80 rounded-2xl border border-slate-700/60 text-left">
                  <p className="text-xs font-semibold text-rose-400 uppercase tracking-wider mb-2">Mystery Prompt:</p>
                  <p className="text-sm font-medium text-white mb-4">"What is your ideal Saturday night: live concert or cozy home cooking?"</p>
                  <div className="space-y-2">
                    <button onClick={() => { setBlindDateAnswer("Live concert & dancing!"); setBlindDateMatched(true); }} className={`w-full p-3 rounded-xl text-xs font-semibold text-left transition-all ${blindDateAnswer === "Live concert & dancing!" ? 'bg-rose-500 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>
                      🎸 Energetic live concert & night out
                    </button>
                    <button onClick={() => { setBlindDateAnswer("Cozy home cooking & movies"); setBlindDateMatched(true); }} className={`w-full p-3 rounded-xl text-xs font-semibold text-left transition-all ${blindDateAnswer === "Cozy home cooking & movies" ? 'bg-rose-500 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}`}>
                      🍷 Cooking handmade dinner & watching movies
                    </button>
                  </div>
                </div>
                {blindDateMatched && (
                  <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 text-xs animate-fade-in">
                    ✨ Match found with Sophia Lin! You both share the same Saturday vibe.
                  </div>
                )}
                <div className="flex gap-2">
                  {blindDateMatched ? (
                    <button onClick={() => { setShowBlindDateModal(false); const sophia = matches.find(m => m.profile.name.includes("Sophia")); if (sophia) setActiveChat(sophia); setActiveTab('matches'); }} className="flex-1 py-3 rounded-xl bg-gradient-to-r from-rose-500 to-pink-500 text-white font-bold text-sm shadow-md hover:opacity-90 transition-opacity cursor-pointer">
                      Enter Blind Chat With Sophia
                    </button>
                  ) : (
                    <button onClick={() => setShowBlindDateModal(false)} className="w-full py-2.5 rounded-xl bg-slate-800 text-slate-400 text-sm hover:text-white">Close</button>
                  )}
                </div>
              </div>
            </div>
          )}

          {showMatchModal && matchedProfile && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-lg animate-fade-in">
              <ConfettiEffect />
              <div className="relative w-full max-w-sm bg-gradient-to-b from-slate-900 to-slate-950 rounded-3xl p-6 border border-slate-800 shadow-2xl text-center space-y-6 z-10">
                <div>
                  <div className="inline-flex items-center justify-center w-12 h-12 rounded-full bg-rose-500/20 text-rose-500 mb-2">
                    <Flame className="w-7 h-7 fill-current animate-bounce" />
                  </div>
                  <h2 className="text-3xl font-black tracking-wider bg-gradient-to-r from-rose-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">
                    IT'S A MATCH!
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">You and {matchedProfile.name} liked each other.</p>
                </div>
                <div className="flex items-center justify-center -space-x-6 py-2">
                  <img src={userProfile.photos[0]} alt="You" className="w-24 h-24 rounded-full object-cover border-4 border-slate-900 shadow-xl ring-2 ring-rose-500/50" />
                  <img src={matchedProfile.photos[0]} alt={matchedProfile.name} className="w-24 h-24 rounded-full object-cover border-4 border-slate-900 shadow-xl ring-2 ring-pink-500/50" />
                </div>
                <div className="space-y-2">
                  <button onClick={() => { setShowMatchModal(false); const existingMatch = matches.find(m => m.profile.id === matchedProfile.id); if (existingMatch) setActiveChat(existingMatch); setActiveTab('matches'); }} className="w-full py-3.5 rounded-full bg-gradient-to-r from-rose-500 to-pink-500 text-white font-bold text-sm shadow-lg shadow-rose-500/30 hover:opacity-90 active:scale-95 transition-all cursor-pointer">
                    Send a Message
                  </button>
                  <button onClick={() => setShowMatchModal(false)} className="w-full py-3 rounded-full bg-slate-800 text-slate-300 font-semibold text-sm hover:bg-slate-700 active:scale-95 transition-colors cursor-pointer">
                    Keep Swiping
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
